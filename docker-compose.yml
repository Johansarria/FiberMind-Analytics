# ─────────────────────────────────────────────
# FiberMind Analytics - Docker Compose (Multi-ISP)
# ─────────────────────────────────────────────
# Commands:
#   Start all:      docker compose up -d
#   Just the API:   docker compose up -d fibermind
#   With Ollama:    docker compose --profile ai up -d
#   With Dashboard: docker compose --profile dashboard up -d
#   Full stack:     docker compose --profile all up -d
#
# Multi-ISP: Las DBs de cada ISP van en /data/<isp_id>/
#   Ej: /data/chiminangos/ftth.db, /data/bellavista/ftth.db
# ─────────────────────────────────────────────

services:

  # ─── PostgreSQL (opcional - para ISPs que prefieran SQL sobre SQLite) ───
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fibermind
      POSTGRES_USER: fibermind
      POSTGRES_PASSWORD: fibermind_secret
      POSTGRES_INITDB_ARGS: "--auth=trust"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fibermind"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "5432:5432"
    profiles: ["all"]

  # ─── Ollama (IA Local) ───
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: "0.0.0.0"
    ports:
      - "11435:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    profiles: ["ai", "all"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ─── FiberMind - API REST (Multi-ISP) ───
  fibermind:
    build:
      context: .
      dockerfile: Dockerfile
      target: full
    environment:
      FIBERMIND_CONFIG: /app/fibermind.yml
      FIBERMIND_MODE: production
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    ports:
      - "8000:8000"
    volumes:
      - ./fibermind.yml:/app/fibermind.yml:ro
      - fibermind_data:/data
    command: >
      sh -c "uvicorn src.api.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    profiles: ["all"]

  # ─── FiberMind - Telegram Bot ───
  fibermind-bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    environment:
      FIBERMIND_CONFIG: /app/fibermind.yml
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN required}
    volumes:
      - ./fibermind.yml:/app/fibermind.yml:ro
      - fibermind_data:/data
    command: >
      sh -c "python -m src.infrastructure.telegram.bot"
    profiles: ["ai", "all"]
    depends_on:
      ollama:
        condition: service_healthy

  # ─── FiberMind - Dashboard (Multi-ISP) ───
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      target: full
    environment:
      FIBERMIND_CONFIG: /app/fibermind.yml
    ports:
      - "8501:8501"
    volumes:
      - ./fibermind.yml:/app/fibermind.yml:ro
      - fibermind_data:/data
    command: >
      sh -c "streamlit run src/dashboard/app.py --server.port=8501 --server.address=0.0.0.0"
    profiles: ["dashboard", "all"]

volumes:
  pgdata:
  ollama_data:
  fibermind_data:
