[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fibermind-analytics"
version = "0.2.0"
description = "Plataforma de analítica e inteligencia artificial para infraestructura FTTH - Inspección OTDR, detección de fallas y consultas en lenguaje natural"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Johan Sarria", email = "johansarria59@gmail.com"},
]
keywords = ["ftth", "otdr", "optical-fiber", "telecom", "ai", "isp", "network-monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Telecommunications Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Communications :: Telephony",
]

[project.urls]
Homepage = "https://github.com/Johansarria/FiberMind-Analytics"
Repository = "https://github.com/Johansarria/FiberMind-Analytics"
Documentation = "https://github.com/Johansarria/FiberMind-Analytics#readme"

[project.optional-dependencies]
web = ["fastapi>=0.115.0", "uvicorn[standard]>=0.32.0", "pydantic>=2.0.0"]
dashboard = ["streamlit>=1.40.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27.0"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
